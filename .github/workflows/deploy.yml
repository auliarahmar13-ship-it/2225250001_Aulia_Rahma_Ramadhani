# Pemeriksaan otomatis (CI): setiap push & pull request menjalankan semua tes Python
# (bank soal, statistik, RMT, Gemini tiruan, endpoint API lokal & Vercel, konfigurasi PWA).
# Deploy TIDAK lagi lewat GitHub Pages: aplikasi di-hosting di Vercel (lihat docs/09),
# yang otomatis men-deploy setiap push ke branch main.
name: Tes DeretKu

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Uji Python (tanpa internet & tanpa API key asli)
        run: python -m unittest discover python/tests
